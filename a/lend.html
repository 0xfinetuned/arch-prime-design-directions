<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lend · Arch Prime</title>
<link rel="stylesheet" href="style.css">
<script src="../shared/data.js"></script>
<script src="shell.js"></script>
</head>
<body>
<script>
const { AP, px, mark, btn, rows, led, gauge, esc } = P;
const L = AP.lend;
const TIPS = {
  "Borrowing power": "What your account can borrow now, at the market's rates. Spend it on a buy or a Boost; it shows up as a loan.",
  Health: "Everything in this account backs every loan and Boost. 100 means nothing owed; 0 means liquidation.",
  Lending: "Every deposit lends itself and earns the supply rate. Withdraw any time.",
  Used: "How much of your borrowing power your loans already use.",
};
const tile = (t, i) => {
  const head = `<div class="tl-h"><span${TIPS[t.title] ? ` class="tip" title="${esc(TIPS[t.title])}"` : ""}>${esc(t.title)}</span></div>`;
  const body = t.gauge != null
    ? `<div class="gauge-wrap">${gauge(t.gauge, t.word, { size: 176 })}</div>`
    : `<div class="tl-hero"><span class="fig-m" data-roll="${i * 110}">${esc(t.hero)}</span><span class="${t.sub.startsWith("+") ? "up" : "muted"} tnum" style="font-size:14px">${esc(t.sub)}</span></div>`;
  const r = rows(t.rows.map(([k, v]) => [k, esc(v), TIPS[k]]), "is-closed");
  const ctas = t.ctas ? `<div class="group">${t.ctas.map((c) => btn.secondary(c, { sm: true })).join("")}</div>` : "";
  return `<section class="tl" aria-label="${esc(t.title)}">${head}${body}${r}${ctas}</section>`;
};

const mkt = L.markets.map((m) => `
  <tr>
    <td><div class="asset">${mark(m.sym)}<span>${esc(m.name)}</span></div></td>
    <td class="r up">${esc(m.supply)}</td>
    <td class="r">${esc(m.borrow)}</td>
    <td class="r">${esc(m.supplied)}</td>
    <td class="r">${esc(m.borrowed)}</td>
    <td class="pl"><span style="display:inline-flex;align-items:center;gap:12px">${led(m.util)}<span class="tnum">${m.util}%</span></span></td>
    <td class="r"><small>${esc(m.you[0])}</small><span class="${m.you[1] === "None" ? "faint" : ""}">${esc(m.you[1])}</span></td>
    <td class="w-ch"><span class="ch">${px("chevron", { size: 12 })}</span></td>
  </tr>`).join("");

P.page({
  active: "lend", title: "Lend",
  html: `
  <h1 class="sr">Lend</h1>
  <p class="label rise" style="margin-bottom:16px">${esc(AP.account.name)}</p>
  <div class="tiles rise" style="--dl:60ms">${L.tiles.map(tile).join("")}</div>

  <section class="rise" style="--dl:180ms; margin-top:80px" aria-label="Markets">
    <div class="sec"><h2 class="h2">Markets</h2></div>
    <table class="tbl">
      <colgroup><col><col style="width:120px"><col style="width:120px"><col style="width:120px"><col style="width:120px"><col style="width:200px"><col style="width:140px"><col style="width:44px"></colgroup>
      <thead><tr>${L.columns.map((c, i) => `<th class="${i === 0 ? "" : i === 5 ? "pl" : "r"}">${esc(c)}</th>`).join("")}<th class="w-ch"></th></tr></thead>
      <tbody>${mkt}</tbody>
    </table>
  </section>`,
});
</script>
</body>
</html>
