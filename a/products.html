<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime Yield · Arch Prime</title>
<link rel="stylesheet" href="style.css">
<script src="../shared/data.js"></script>
<script src="shell.js"></script>
</head>
<body>
<script>
const { AP, px, mark, btn, seg, dir, move, spark, esc } = P;
const D = AP.products;
const [balLabel, balValue] = D.yours.summary[0];
const [bw, bc] = balValue.split(".");

const yourRows = D.yours.rows.map((r) => `
  <tr>
    <td><div class="asset">${mark(r.sym)}<div class="asset-t"><span>${esc(r.sym)}</span><small>${esc(r.asset)}</small></div></div></td>
    <td class="r">${esc(r.apy)}</td>
    <td class="r muted">${esc(r.boost)}</td>
    <td class="r">${esc(r.balance)}</td>
    <td class="r ${dir(r.dir)}">${move(r.d24)}</td>
    <td class="r">${esc(r.earned)}</td>
    <td class="r">${btn.secondary(r.action, { sm: true })}</td>
  </tr>`).join("");

const cards = D.all.map((p, i) => `
  <article class="prod">
    <a class="prod-h" href="${p.sym === "primeBTC" ? "prime-btc.html" : "#"}">${mark(p.sym, "mk-l")}
      <span class="asset-t grow"><span class="h3">${esc(p.sym)}</span><small>${esc(p.asset)}</small></span>
      <span class="ch">${px("chevron", { size: 12 })}</span></a>
    <div class="prod-mid">
      <div class="kv" style="display:flex;flex-direction:column;gap:8px"><span class="label">APY</span><span class="fig-l" data-roll="${200 + i * 120}">${esc(p.apy)}</span></div>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end"><span class="label-sm">Last 30 days</span>${spark(p.nav, { w: 220, h: 48, area: true, delay: 300 + i * 120 })}</div>
    </div>
    ${P.rows([["Total deposited", esc(p.tvl)], ["Boost up to", esc(p.boostUpTo)], [p.apyAt[0], esc(p.apyAt[1])]], "is-closed")}
    <div class="group">${btn.primary("Deposit")}${btn.secondary("Boost")}</div>
  </article>`).join("");

P.page({
  active: "yield", title: "Prime Yield",
  html: `
  <h1 class="sr">Prime Yield</h1>
  <section class="rise" aria-label="Your products">
    <div class="sec"><h2 class="h2">Your products</h2></div>
    <div class="summary">
      <div class="kv"><span class="label">${esc(balLabel)}</span><span class="fig-xl" style="font-size:80px"><span data-roll="0">${esc(bw)}</span><span class="dim" data-roll="240">.${esc(bc)}</span></span></div>
      <div class="kv"><span class="label">${esc(D.yours.summary[1][0])}</span><span class="fig-m" data-roll="120">${esc(D.yours.summary[1][1])}</span></div>
      <div class="kv"><span class="label tip" title="The product's APY on its balance, in dollars, as the balance sheet states it.">${esc(D.yours.summary[2][0])}</span><span class="fig-m" data-roll="180">${esc(D.yours.summary[2][1])}</span></div>
    </div>
    <table class="tbl">
      <colgroup><col><col style="width:96px"><col style="width:96px"><col style="width:140px"><col style="width:190px"><col style="width:120px"><col style="width:140px"></colgroup>
      <thead><tr>${D.yours.columns.map((c, i) => `<th class="${i ? "r" : ""}">${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${yourRows}</tbody>
    </table>
  </section>

  <section class="range rise" style="--dl:120ms" aria-label="Range">
    <div><span class="label">${esc(D.range[0][0])}</span><span class="fig-l or" data-roll="300">${esc(D.range[0][1])}</span></div>
    <div><span class="label">${esc(D.range[1][0])}</span><span class="fig-l" data-roll="360">${esc(D.range[1][1])}</span></div>
  </section>

  <section class="rise" style="--dl:200ms; margin-top:80px" aria-label="All products">
    <div class="sec"><h2 class="h2">All products</h2><div class="sec-end"><span class="label">Show products as</span>${seg(["Cards", "List"], "Cards")}</div></div>
    <div class="prods">${cards}</div>
  </section>`,
});
</script>
</body>
</html>
