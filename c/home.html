<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home · Arch Prime</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="../shared/data.js"></script>
<script src="shell.js"></script>
<script>
const { AP, icon, mark, tile, btn, seg, tabs, badge, tip, spark, gauge, chart } = UI;
const H = AP.home;
const TIPS = {
  "Earning per year": "What the account earns in a year at today's rates, in dollars: each holding's rate on its balance, less what the debt costs. BTC and dollars earn different rates, so there is no one rate for the total.",
  "Can borrow": "The most the market would let Main borrow now, cut by 1% for price and interest drift and bounded by the bank's liquidity. Other assets have their own figure.",
  "Loan to value": "What you owe as a share of what backs it.",
  "Liquidates at": "The loan-to-value at which the account can be liquidated.",
  "Liquidation price": "The BTC price at which the account can be liquidated.",
};
const actIcon = { Transfer: "transfer", "Move funds": "move", Withdraw: "withdraw", Deposit: "deposit" };

const columns = H.columns.map((c, k) => `
  <button class="col-pick ${k === 0 ? "on" : ""} ${c.disabled ? "dis" : ""}" ${c.disabled ? `title="${c.disabled}" aria-disabled="true"` : ""}>
    <span class="ct"><i class="sel"></i>${c.title}</span>
    ${c.rows.map(([k2, v]) => `<span class="cr"><span class="k">${k2}${TIPS[k2] ? " " + tip(TIPS[k2]).replace("<span", "<span style=\"display:inline-block;vertical-align:-2px\"") : ""}</span><span>${v}</span></span>`).join("")}
  </button>`).join("");

const assetCols = "minmax(0,1.5fr) 100px 168px 76px 104px 20px";
const assetRows = H.assets.map((a) => `
  <a class="tr" href="#" style="grid-template-columns:${assetCols}">
    <span class="asset">${mark(a.sym, 34)}<span><div class="nm">${a.name}</div><div class="sb">${a.amount}</div></span></span>
    <span>${spark(a.spark, { w: 88, h: 26 })}</span>
    <span class="r ${a.dir}">${a.d24}</span>
    <span class="r up">${a.earning}</span>
    <span class="r">${a.value}</span>
    ${icon("chevron", "chev s16")}
  </a>`).join("");

const loanCols = "minmax(0,1.6fr) 120px 120px 104px";
const loanRows = H.loans.map((l) => `
  <div class="tr link" style="grid-template-columns:${loanCols}">
    <span class="asset">${mark("USD", 34)}<span><div class="nm">${l.name} <span class="muted">· ${l.amount}</span></div><div class="sb">${l.line}</div></span></span>
    <span class="r">${l.rate}</span><span class="r">${l.borrowed}</span>
    <span class="r">${btn("Pay back", { sm: true })}</span>
  </div>`).join("");

const actRows = H.activity.map((a) => `
  <div class="tr link" style="grid-template-columns:minmax(0,1.8fr) 150px 96px 20px">
    <span class="asset"><span style="width:34px;height:34px;border-radius:50%;background:var(--wash);box-shadow:inset 0 0 0 1px var(--hair);display:grid;place-items:center">${icon(a.verb === "Bought" ? "trade" : a.verb === "Supplied" ? "lend" : a.verb === "Borrowed" ? "withdraw" : "deposit")}</span><span><div class="nm">${a.verb}</div><div class="sb">${a.detail}</div></span></span>
    <span class="r muted">${a.when}</span><span class="r cap" style="letter-spacing:.04em;text-transform:none">${a.tx}</span>${icon("chevron", "chev s16")}
  </div>`).join("");

const accounts = AP.account.accounts.map((a) => `
  <label class="acct-row">
    <i class="radio ${a.name === AP.account.name ? "on" : ""}"></i>
    <span class="asset" style="gap:10px">${a.name === "All accounts" ? `<span style="width:28px;height:28px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--hair-2);display:grid;place-items:center">${icon("columns", "s16")}</span>` : tile(a.name)}<span><div class="nm">${a.name}</div><div class="sb">${a.line}</div></span></span>
    <span>${a.net}</span>
  </label>`).join("");

UI.mount("home", `
<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Home</h1>
<div class="rail-grid">
  <div class="stack">
    <section class="card rise" aria-label="Account value">
      <div class="card-head"><span class="cap">${H.label}</span>
        <div class="value-actions">
          ${H.actions.map((a) => btn(a, { kind: a === "Deposit" ? "pri" : "sec", icon: a === "Deposit" ? null : actIcon[a], arrow: a === "Deposit" })).join("")}
        </div>
      </div>
      <div class="value-top">
        <div class="num-xl" data-roll>${H.value}</div>
        <div class="deltas"><span class="delta up">${H.change.usd}</span><span class="delta up">${H.change.pct}</span>${btn("Share", { kind: "ghost", sm: true, icon: "share" })}</div>
        <span class="grow"></span>
        <div style="padding-bottom:4px">${seg(H.ranges, H.range, { label: "Range" })}</div>
      </div>
      <div class="chart" id="valueChart" style="margin-top:14px"></div>
      <div class="cols3">${columns}</div>
    </section>

    <section class="card rise" aria-label="Lists" style="padding-top:12px">
      <div class="row" style="align-items:flex-end">
        <div class="grow" id="listTabs">${tabs(H.tabs, H.tabs[0])}</div>
        <span style="position:relative;top:-4px;margin-left:-1px">${btn("Columns", { iconOnly: true, icon: "columns", sm: true, kind: "sec" })}</span>
      </div>
      <div class="tbl" data-panel="All assets" style="margin-top:8px">
        <div class="tr th" style="grid-template-columns:${assetCols}">${H.assetColumns.map((c, i) => `<span class="${i > 1 ? "r" : ""}">${c}</span>`).join("")}<span></span></div>
        ${assetRows}
      </div>
      <div class="tbl" data-panel="Loans" hidden style="margin-top:8px">
        <div class="tr th" style="grid-template-columns:${loanCols}"><span>Loan</span><span class="r">Rate</span><span class="r">Borrowed</span><span></span></div>
        ${loanRows}
      </div>
      <div class="tbl" data-panel="Activity" hidden style="margin-top:8px">${actRows}</div>
    </section>
  </div>

  <aside class="stack" aria-label="Risk and accounts">
    <section class="card rise" id="risk">
      <div class="card-head"><a class="cap" href="#">Risk ${icon("chevron")}</a>${badge(H.risk.word)}</div>
      <div style="display:grid;justify-items:center;margin:18px 0 14px">${gauge(H.risk.score, H.risk.word)}</div>
      <div>${H.risk.rows.map(([k, v]) => `<div class="kv"><span class="k">${k} ${tip(TIPS[k])}</span><span class="v">${v}</span></div>`).join("")}</div>
    </section>

    <section class="card rise">
      <div class="card-head"><span class="cap">Accounts</span></div>
      <div style="margin-top:8px">${accounts}</div>
      <div style="margin-top:12px">${btn("Add sub-account", { kind: "ghost", icon: "plus", block: true, sm: true })}</div>
    </section>

    <section class="card rise">
      <div class="card-head"><span class="cap">Boost</span></div>
      <div class="h-title" style="margin-top:16px">${H.boost.title}</div>
      <p class="muted" style="margin:6px 0 18px;font-size:14px">${H.boost.body}</p>
      ${btn(H.boost.cta, { kind: "sec", arrow: true, block: true })}
    </section>
  </aside>
</div>`, () => {
  const days = (i) => `Oct ${23 + Math.floor(i / 4)}`;
  chart(document.getElementById("valueChart"), {
    series: H.series, height: 236, tickCount: 3,
    fmtY: (v) => "$" + (v / 1000).toFixed(1) + "K",
    xLabels: [2, 6, 10, 14, 18, 22, 26].map((i) => [i, days(i)]),
    readCap: (i) => `${days(i)} · ${String((i % 4) * 6).padStart(2, "0")}:00 UTC`,
    readVal: (v) => "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
    park: 23,
  });
  const lt = document.querySelector("#listTabs .tabs");
  lt.addEventListener("pick", (e) => document.querySelectorAll("[data-panel]").forEach((p) => (p.hidden = p.dataset.panel !== e.detail)));
  document.querySelectorAll(".col-pick:not(.dis)").forEach((b) => b.addEventListener("click", () => document.querySelectorAll(".col-pick").forEach((x) => x.classList.toggle("on", x === b))));
});
</script>
</body>
</html>
