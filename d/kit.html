<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit · Arch Prime</title>
<link rel="stylesheet" href="style.css">
<script src="../shared/data.js"></script>
<script src="app.js"></script>
</head>
<body>
<script>
const { AP, icon, archMark, mark, btn, seg, tabs, badge, kvs, dir, move, bar, orb, chart, spark, gauge, acard, esc } = H;
const D = AP.home;
const [whole, cents] = D.value.split(".");

const PAL = {
  light: ["Light · cream and blush", [
    ["Ground", "#f6eee7"], ["Cushion", "#fffaf5"], ["Well", "#f2e5da"], ["Ink", "#2a1d18"], ["Ink 2", "#6e5a50"], ["Ember", "#ff5e00"],
    ["Amber", "#f0a040"], ["Rose", "#e58f7f"], ["Up", "#2f7a52"], ["Down", "#b5432c"], ["BTC", "#f0a040"], ["Dollars", "#5aa37a"],
  ]],
  dark: ["Dark · espresso and plum-black", [
    ["Ground", "#120c0e"], ["Cushion", "#271c1f"], ["Well", "#140d10"], ["Ink", "#f6ece2"], ["Ink 2", "#b9a89d"], ["Ember", "#ff6a1a"],
    ["Amber", "#ffb066"], ["Rose", "#f09a8a"], ["Up", "#8fd6a8"], ["Down", "#ff9580"], ["BTC", "#ffad4d"], ["Dollars", "#7fcf9a"],
  ]],
};
const palette = (t) => { const [label, set] = PAL[t]; return `<div class="sw-set"><span class="small">${label}</span><div class="sw-row">${set.map(([n, c]) => `<div class="sw"><i style="background:${c}"></i><span>${n}</span><small>${c}</small></div>`).join("")}</div></div>`; };

const GR = [
  ["Glow orb", "Ember → amber → rose, blurred", "background:radial-gradient(closest-side,var(--orb-1),var(--orb-2) 42%,var(--orb-3) 66%,transparent),var(--bg)"],
  ["Chart stroke", "Rose → amber → ember", "background:linear-gradient(90deg,var(--ch-0),var(--ch-1) 55%,var(--ch-2))"],
  ["Warm cushion", "An ember bloom in the corner", "background:radial-gradient(70% 90% at 100% 100%,color-mix(in srgb,var(--ember) 26%,transparent),transparent 70%),radial-gradient(60% 70% at 85% 110%,color-mix(in srgb,var(--rose) 30%,transparent),transparent 70%),linear-gradient(172deg,var(--cu-a),var(--cu-b))"],
  ["Primary pill", "Sheen over the house colour", "background:radial-gradient(120% 90% at 30% -20%,var(--pri-sheen),transparent 55%),linear-gradient(180deg,var(--pri-a),var(--pri-b))"],
];
const grads = (t) => `<div class="sw-set is-ground" data-theme="${t}"><span class="small">${t === "light" ? "Light" : "Dark"}</span><div class="grad-row">${GR.map(([n, s, bg]) => `<div class="sw"><i style="${bg};height:84px;border-radius:22px"></i><span>${n}</span><small>${s}</small></div>`).join("")}</div></div>`;

const NAV = [["home", "Home"], ["yield", "Prime Yield"], ["lend", "Lend"], ["trade", "Trade"], ["points", "Points"], ["docs", "Documentation"]];
const ACT = [
  ["deposit", "Deposit"], ["withdraw", "Withdraw"], ["transfer", "Transfer"], ["move", "Move funds"], ["share", "Share"], ["copy", "Copy"], ["external", "External"],
  ["search", "Search"], ["chevron", "Chevron"], ["theme", "Theme"], ["collapse", "Collapse"], ["close", "Close"], ["flip", "Swap flip"], ["columns", "Settings / Columns"],
];
const ks = (title, sub, body, d = 0) => `<section class="cu ks rise" style="--dl:${d}ms"><div class="ks-h"><h2 class="h3">${title}</h2>${sub ? `<small>${sub}</small>` : ""}</div><div class="ks-b">${body}</div></section>`;
const line = (cap, body) => `<div class="kit-line"><span class="kit-cap">${cap}</span>${body}</div>`;

const pane = (t) => `<div class="pane" data-theme="${t}">${orb()}<div class="lift">
  <div style="display:flex;justify-content:space-between"><span class="eyebrow">${esc(D.label)}</span><span class="small">${t === "dark" ? "Dark" : "Light"}</span></div>
  <div class="fig-l">${esc(whole)}<span class="dim">.${esc(cents)}</span></div>
  <div class="cu" style="padding:16px 18px"><div class="chart" id="pane-${t}"></div></div>
  <div class="group">${btn.primary("Deposit")}${btn.soft("Withdraw", { icon: "withdraw" })}</div>
  <div style="display:flex;gap:6px;align-items:center"><span class="tabx is-on" style="flex:1">${icon("home", { size: 21 })}<span>Home</span></span><span class="tabx" style="flex:1">${icon("lend", { size: 21 })}<span>Lend</span></span></div>
  <div class="group">${badge("Healthy")}${badge("Watch")}${badge("At risk")}</div>
  <div class="group" style="gap:10px">${["BTC", "USD", "primeBTC", "primeUSD"].map((s) => mark(s, "mk-s")).join("")}</div>
  <div class="group tnum" style="gap:18px"><span class="up">${esc(D.change.usd)}</span><span class="down">${esc(D.assets[0].d24.split(" · ")[1])}</span><span style="flex:1"></span>${bar(62)}</div>
</div></div>`;

const card = acard(AP.account.name, AP.account.address);

H.page({
  active: "", title: "Kit",
  html: `
  <div class="kit-hero">
    ${orb()}
    <div class="lift" style="display:flex;flex-direction:column;gap:14px"><span class="eyebrow rise">Arch Prime · Direction D</span><h1 class="fig-hero focus">Hearth<span class="glowtext">.</span></h1></div>
    <p class="rise" style="--dl:200ms">A warm private-bank lounge in the landing's family. Soft cushions instead of boxes, an ember glow behind each screen's figure, a card coloured by what it holds, and a fine grain over all of it. Ember means now and action; green and coral mean up and down.</p>
  </div>

  ${ks("Colour", "Two grounds, few hues, each with a job", `${palette("light")}${palette("dark")}`, 100)}
  ${ks("Gradients", "Drawn from the live tokens of each theme", `${grads("light")}${grads("dark")}`, 140)}
  ${ks("Both themes", "Designed for each ground, not inverted", `<div class="panes">${pane("light")}${pane("dark")}</div>`, 180)}

  ${ks("Account card", "Its blooms come from the holdings, sized by share", `<div style="display:flex;gap:40px;align-items:center"><div style="width:400px;display:flex;flex-direction:column;gap:14px">${card.card}${card.alloc}${card.legend}</div><p class="muted" style="max-width:300px">Each holding lends the card its own colour: BTC amber, primeBTC ember, primeUSD rose, dollars green. The bigger the share, the larger its bloom. The same colours mark the assets everywhere else.</p></div>`)}

  ${ks("Type", "PP Neue Montreal 400 and 500, warm ink", `<div>
    <div class="type-row"><span class="small">Hero · 104 / 400<br>−0.055em</span><span class="fig-hero">${esc(whole)}<span class="dim">.${esc(cents)}</span></span></div>
    <div class="type-row"><span class="small">Figure L · 52</span><span class="fig-l glowtext">${esc(AP.primeBtc.head[0][1])}</span></div>
    <div class="type-row"><span class="small">Figure M · 36</span><span class="fig-m">${esc(AP.lend.tiles[0].hero)}</span></div>
    <div class="type-row"><span class="small">Title · 30</span><span class="title">Your products</span></div>
    <div class="type-row"><span class="small">Heading · 18</span><span class="h3">${esc(D.boost.title)}</span></div>
    <div class="type-row"><span class="small">Body · 15</span><span>${esc(D.boost.body)}</span></div>
    <div class="type-row"><span class="small">Label · 13</span><span class="eyebrow">${esc(D.label)}</span></div>
    <div class="type-row"><span class="small">Tabular · 15</span><span class="tnum">${esc(D.assets[0].value)} &nbsp; ${esc(D.assets[0].amount)} &nbsp; <span class="down">${esc(D.assets[0].d24)}</span></span></div>
  </div>`)}

  ${ks("Buttons", "Cushion pills; the arrow disc is an ember", `
    ${line("Primary", `${btn.primary("Deposit")}${btn.primary("Deposit", { sm: true })}`)}
    ${line("Soft", `${btn.soft("Withdraw", { icon: "withdraw" })}${btn.soft("Transfer", { icon: "transfer" })}${btn.soft("Boost", { sm: true })}`)}
    ${line("Ghost", `${btn.ghost("Share", { icon: "share" })}${btn.ghost("Explore", { icon: "arrow", after: true })}${btn.ghost("Add sub-account", { icon: "plus" })}`)}
    ${line("Icon", `${btn.icon("share", "Share")}${btn.icon("copy", "Copy")}${btn.icon("columns", "Columns")}${btn.icon("flip", "Switch what you pay and receive", { raised: true })}${btn.icon("close", "Close")}${btn.icon("chevron", "Next", { sm: true })}`)}
    ${line("Wide", `<div style="width:440px">${btn.primary(AP.trade.cta, { wide: true })}</div>`)}`)}

  ${ks("Controls", "Pressed wells, raised cushions", `
    ${line("Segmented", `${seg(D.ranges, D.range)}${seg(AP.trade.modes, "Spot", "seg-l")}${seg(["Cards", "List"], "Cards")}`)}
    ${line("Tabs", tabs(D.tabs, "All assets"))}
    ${line("Chips", `<div class="group"><button class="chip">25%</button><button class="chip">50%</button><button class="chip">Max</button></div>`)}
    ${line("Switch", `<button class="switch" role="switch" aria-checked="false"><i></i><span>Pro</span></button><button class="switch is-on" role="switch" aria-checked="true"><i></i><span>Pro</span></button>`)}`)}

  ${ks("Inputs", "Amount with token menu · text field", `<div class="kit-two">
    <div class="well amount">
      <div class="field-label"><span>${esc(AP.trade.pay.label)}</span></div>
      <span class="amount-v">${esc(AP.trade.pay.amount)}</span>
      <button class="token" aria-label="Choose the asset to pay with">${mark("USD", "mk-s")}<span>${esc(AP.trade.pay.sym)}</span>${icon("caret", { size: 15 })}</button>
      <div class="amount-foot"><span>${esc(AP.trade.pay.foot)}</span><span class="group" style="gap:12px"><span>${esc(AP.trade.pay.balance)}</span><button class="link">Max</button></span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:24px;padding-top:6px">
      <label class="field"><span class="field-label"><span>Recipient's Arch address</span></span><span class="text-in"><span>Their Arch wallet address</span>${btn.soft("Paste", { sm: true })}</span></label>
      <div class="group"><button class="chip">25%</button><button class="chip">50%</button><button class="chip">Max</button></div>
    </div>
  </div>`)}

  ${ks("Table row", "Soft rows, tinted marks, no rules", `<table class="list">
    <colgroup><col><col style="width:128px"><col style="width:168px"><col style="width:84px"><col style="width:112px"><col style="width:44px"></colgroup>
    <thead><tr>${D.assetColumns.map((c, i) => `<th class="${i === 1 ? "pl" : i ? "r" : ""}">${esc(c)}</th>`).join("")}<th></th></tr></thead>
    <tbody>${D.assets.slice(0, 2).map((a) => `<tr>
      <td><div class="asset">${mark(a.sym)}<div class="asset-t"><span>${esc(a.name)}</span><small>${esc(a.amount)}</small></div></div></td>
      <td class="pl">${spark(a.spark, { w: 92, h: 30 })}</td>
      <td class="r ${dir(a.dir)}">${move(a.d24)}</td><td class="r up">${esc(a.earning)}</td><td class="r">${esc(a.value)}</td>
      <td class="w-ch"><span class="chev">${icon("chevron", { size: 16 })}</span></td></tr>`).join("")}</tbody></table>`)}

  ${ks("Badges", "Health in one vocabulary", `<div class="group" style="gap:10px">${badge("Healthy")}${badge("Watch")}${badge("At risk")}<span class="badge is-soon">soon</span><span class="badge is-test">test</span>${badge(AP.primeBtc.boost.badge, "is-warm")}</div>`)}

  ${ks("Charts", "Thick soft strokes with a glow; now is a pearl", `
    <div class="kit-two">
      <div style="display:flex;flex-direction:column;gap:10px"><span class="small">Account value · area line</span><div class="chart" id="kit-line"></div></div>
      <div style="display:flex;flex-direction:column;gap:10px"><span class="small">APY · soft steps and a 30-day avg of pearls</span><div class="chart" id="kit-step"></div></div>
    </div>
    <div class="kit-two" style="align-items:end">
      <div style="display:flex;gap:40px;align-items:flex-end">${gauge(D.risk.score, D.risk.word, { size: 200 })}</div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <span class="small">Utilization</span><span style="display:inline-flex;gap:12px;align-items:center">${bar(AP.lend.markets[0].util)}<span class="tnum">${AP.lend.markets[0].util}%</span></span>
        <span class="small">${esc(AP.primeBtc.hold.rowLabel)}</span>${bar(45.6, { wide: true })}
        <div style="display:flex;gap:32px;align-items:flex-end;margin-top:6px">${spark(D.assets[0].spark, { w: 140, h: 40 })}${spark(AP.products.all[1].nav, { w: 180, h: 48, area: true })}</div>
      </div>
    </div>`)}

  ${ks("Icons", "Soft rounded strokes; nav icons carry one ember that glows when chosen", `
    <div class="icons is-nav">${NAV.map(([k, n], i) => `<div class="icn"><div class="pair">${icon(k, { size: 22 })}<span class="tabx is-on" style="height:40px;padding:0 9px;border-radius:20px">${icon(k, { size: 22 })}</span></div><span>${n}</span></div>`).join("")}</div>
    <div class="icons">${ACT.map(([k, n]) => `<div class="icn"><div class="pair">${icon(k, { size: 16 })}${icon(k, { size: 26, w: 1.6 })}</div><span>${n}</span></div>`).join("")}</div>
    ${line("Marks", `${["BTC", "USD", "primeBTC", "primeUSD"].map((s) => `<span class="asset">${mark(s)}<span class="eyebrow">${s}</span></span>`).join("")}<span class="asset" style="color:var(--ink)">${archMark(30)}<span class="eyebrow">Arch</span></span>`)}`)}

  ${ks("Signed out", "One cushion, lit from the corner", `<div class="cu is-warm so">${orb()}<div class="lift" style="display:flex;flex-direction:column;gap:20px">${icon("home", { size: 28 })}<h3 class="title">See your portfolio</h3><div>${btn.primary("Connect wallet")}</div></div></div>`)}
  `,
  after() {
    for (const t of ["light", "dark"]) chart(document.getElementById(`pane-${t}`), { series: D.series, h: 110, label: "Account value", fmt: (v) => "$" + v });
    chart(document.getElementById("kit-line"), { series: D.series, h: 170, axis: true, label: "Account value", fmt: (v) => "$" + (v / 1000).toFixed(1) + "K" });
    chart(document.getElementById("kit-step"), { series: AP.primeBtc.apySeries, step: true, h: 170, axis: true, label: "APY", ref: AP.primeBtc.avg30, refLabel: `30-day avg ${AP.primeBtc.avg30}%`, fmt: (v) => v.toFixed(1) + "%" });
  },
});
</script>
</body>
</html>
