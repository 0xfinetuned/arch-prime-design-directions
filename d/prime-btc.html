<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>primeBTC · Arch Prime</title>
<link rel="stylesheet" href="style.css">
<script src="../shared/data.js"></script>
<script src="app.js"></script>
</head>
<body>
<script>
const { AP, icon, mark, btn, seg, tabs, badge, kvs, bar, orb, chart, esc } = H;
const B = AP.primeBtc;
const TIPS = {
  "7-day APY": "Annualised from the last 7 days of NAV per share, after fees.",
  "30-day APY": "Annualised from the last 30 days of NAV per share, after fees.",
  "Since start": "Annualised since the vault opened, after fees.",
  "Sharpe ratio": "Return per unit of volatility, measured against lending the same asset.",
  "Worst drop": "The largest fall in NAV per share from a peak, to date.",
  "Room left": "What the vault can still take before it reaches its deposit cap.",
};
const gain = (s) => parseFloat(s.replace(/[^\d.]/g, ""));
const maxGain = Math.max(gain(B.hold.rowValue), gain(B.boost.rowValue));

const figs = B.head.map(([k, v, m], i) => `
  <div class="pfig"><span class="eyebrow">${esc(k)}</span>
    <div class="pfig-v"><span class="fig-l focus${i === 0 ? " glowtext" : ""}" style="--dl:${i * 120}ms">${esc(v)}</span><span class="up tnum" style="font-size:14px">${esc(m)}</span></div></div>`).join("");

const offer = (o, primary) => `
  <section class="cu offer${primary ? "" : " is-warm"} rise" style="--dl:${primary ? 220 : 300}ms">
    <div class="offer-h"><h3 class="h3">${esc(o.title)}</h3>${o.badge ? badge(o.badge, "is-warm") : ""}</div>
    <div class="offer-hero"><span class="fig-l focus" style="--dl:${primary ? 300 : 380}ms">${esc(o.hero)}</span><span class="muted">${esc(o.heroUnit)}</span></div>
    <div class="offer-yr">
      <div class="kv"><span>${esc(o.rowLabel)}</span><span>${esc(o.rowValue)}</span></div>
      ${bar((gain(o.rowValue) / maxGain) * 100, { wide: true, delay: primary ? 500 : 650 })}
    </div>
    <div>${primary ? btn.primary(o.cta) : btn.soft(o.cta)}</div>
  </section>`;

const acc = B.disclosure.map((d, i) => `
  <div class="cu acc${i === 0 ? " is-open" : ""} rise" style="--dl:${380 + i * 50}ms">
    <button class="acc-h" aria-expanded="${i === 0}">
      <span class="h3" style="font-size:20px">${esc(d.title)}</span>
      ${d.head.map(([k, v]) => `<span class="kvx"><span>${esc(k)}</span><b>${esc(v)}</b></span>`).join("")}
      <span class="ibtn ibtn-sm">${icon("chevron", { size: 15 })}</span>
    </button>
    ${i === 0 ? `<div class="acc-b"><span class="eyebrow">Reported by the manager</span>${kvs([
      ["NAV per share", esc(B.head[1][1])],
      ["Reported", esc(d.head[0][1])],
      ["Status", badge(d.head[1][1], "is-ok")],
    ])}</div>` : ""}
  </div>`).join("");

H.page({
  active: "yield", sub: "prime-btc", title: B.name,
  html: `
  <header class="cu phead">
    ${orb()}
    <div class="phead-t">${mark("primeBTC", "mk-l")}<h1>${esc(B.name)}</h1><span class="grow"></span>${btn.soft("Vault", { sm: true })}</div>
    <div class="pfigs">${figs}</div>
    ${tabs(B.tabs, "Overview")}
  </header>

  <div class="pgrid">
    <section class="cu chart-cu rise" style="--dl:120ms" aria-label="Performance">
      <div class="chart-bar">${seg(B.chartTabs, "APY")}${seg(B.ranges, "1M")}</div>
      <div class="chart" id="apy-chart"></div>
      <div class="stats">${B.stats.map(([k, v]) => `<div class="stat"><span class="eyebrow tip" title="${esc(TIPS[k])}">${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div>
    </section>
    <aside class="rail" aria-label="Offer">
      ${offer(B.hold, true)}
      ${offer(B.boost, false)}
    </aside>
  </div>

  <section class="accs" style="margin-top:56px" aria-label="Disclosure">${acc}</section>`,
  after() {
    chart(document.getElementById("apy-chart"), {
      series: B.apySeries, step: true, h: 300, axis: true, label: "APY",
      ref: B.avg30, refLabel: `30-day avg ${B.avg30}%`, fmt: (v) => v.toFixed(1) + "%",
    });
  },
});
</script>
</body>
</html>
